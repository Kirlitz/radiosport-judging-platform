<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результаты судейства</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #343a40; color: white; }
        a.btn { padding: 5px 10px; background: #28a745; color: white; text-decoration: none; border-radius: 3px; font-size: 12px; }
    </style>
</head>
<body>
    <a href="/admin">← Вернуться в конструктор</a>
    <h2>Результаты перекрестной проверки: {{ comp.name }}</h2>
    
    <div style="margin-bottom: 20px;">
    <a href="/admin/download_all_ubn/{{ comp.id }}" style="padding: 10px 15px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">Скачать все UBN одним архивом (ZIP)</a>
</div>

    <table>
        <thead>
            <tr>
                <th>Позывной</th>
                <th>Подтверждено связей</th>
                <th>Итого очков</th>
                <th>UBN Отчет</th>
            </tr>
        </thead>
        <tbody>
            {% for call, data in results.items() %}
            <tr>
                <td><strong>{{ call }}</strong></td>
                <td style="text-align: center;">{{ data.valid_qsos }}</td>
                <td style="text-align: center;"><strong>{{ data.points }}</strong></td>
                <td style="text-align: center;"><a href="/admin/download_ubn/{{ comp.id }}/{{ call }}" class="btn">Скачать .ubn</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
