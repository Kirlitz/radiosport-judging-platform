<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отчет принят</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; }
        .success-box { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 30px; border-radius: 8px; }
        a { display: inline-block; margin-top: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="success-box">
        <h2>✅ Отчет успешно принят!</h2>
        <p>Соревнование: <strong>{{ comp.name }}</strong></p>
        <p>Позывной: <strong>{{ callsign }}</strong></p>
        <p>Зачетная группа: <strong>{{ category }}</strong></p>
        <p>Отчет сохранен в базу судейской платформы.</p>
    </div>
    <a href="/">← Вернуться на главную страницу</a>
</body>
</html>
