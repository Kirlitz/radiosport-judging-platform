<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход для судей</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 100px auto; padding: 20px; background: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Вход в судейскую</h2>
        <form method="POST">
            <div class="form-group">
                <label>Логин:</label>
                <input type="text" name="username" required value="admin">
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" name="password" required value="admin123">
            </div>
            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
